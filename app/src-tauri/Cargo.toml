[package]
name = "cs2-stats"
version = "0.2.0"
description = "Stats for CS2 bot matches"
license = "GPL-3.0-only"
edition = "2021"
# MSRV-aware dependency resolution: the machine has Rust 1.85.
rust-version = "1.85"
resolver = "3"

[lib]
name = "cs2_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# reads the extractor's COMPLETE lists and the importer's summary; also used by botmode
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3.5.0"
# the system folder picker for the pro match library (src/pro.rs), used from Rust only
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panic ends the process. The Bot Mode supervisor relies on this: a dead supervisor frees
# its session lease, and the next cleanup turns Bot Mode off (session.rs).
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
# the WebView2 settings interface, to turn off the link status bar (lib.rs hide_status_bar); the
# version Tauri itself uses
webview2-com = "0.38"
# the Leetify API key in Windows Credential Manager (leetify.rs KeyStore); 3.6 is the last line whose
# rust-version (1.75) the machine's Rust 1.85 meets
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Wdk_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
