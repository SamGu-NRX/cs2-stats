[package]
name = "cs2-stats"
version = "0.1.0"
description = "Stats for CS2 bot matches"
edition = "2021"
# MSRV-aware dependency resolution: the machine has Rust 1.85.
rust-version = "1.85"
resolver = "3"

[lib]
name = "cs2_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
