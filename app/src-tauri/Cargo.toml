[package]
name = "cs2-stats"
version = "0.2.0"
description = "Stats for CS2 bot matches"
edition = "2021"
# MSRV-aware dependency resolution: the machine has Rust 1.85.
rust-version = "1.85"
resolver = "3"

[lib]
name = "cs2_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Wdk_System_Threading"] }
