name: Tests

# Every component's own test suite, on every pull request and on main. The jobs read the checked-out
# tree only, with no secrets and read-only permissions. Tests that need the private data folder
# (pro demos, HLTV files, the packs) skip with a message when it is missing, as it is here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App typecheck, vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm exec tsc -p tsconfig.node.json --noEmit
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust tests (cargo test --lib)
    # the desktop app targets Windows: its Bot Mode code and tests use Windows APIs and paths
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rust-version in app/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test --lib --locked
        working-directory: app/src-tauri

  extractor:
    name: Extractor tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  model:
    name: Model tests (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/rating3/requirements.txt
      - run: python -m pip install -r model/rating3/requirements.txt
      - run: python -m unittest discover -v -s model/rating3 -p "test_*.py"

  plugin:
    name: Plugin tests (dotnet test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test plugin/BotMatchStats.Tests
