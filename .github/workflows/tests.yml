name: Tests

# Every component's own test suite, on every pull request and on main. The jobs read the checked-out
# tree only, with no secrets and read-only permissions. Tests that need the private data folder
# (pro demos, HLTV files, the packs) skip with a message when it is missing, as it is here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App typecheck, vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm exec tsc -p tsconfig.node.json --noEmit
      - run: pnpm test
      - run: pnpm build
      # the UI chunks must not carry the stats engine (tools/bundle-budget.ts)
      - run: pnpm bundle-budget

  rust:
    name: Rust tests (cargo test --lib)
    # the desktop app targets Windows: its Bot Mode code and tests use Windows APIs and paths
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rust-version in app/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: cargo test --lib --locked
        working-directory: app/src-tauri

  extractor:
    name: Extractor tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # The pipeline's archive tests run the real 7z and skip without it.
      - name: Make sure 7-Zip is on PATH
        run: command -v 7z || { sudo apt-get update && sudo apt-get install -y p7zip-full; }; 7z | head -2
      # -rs prints why each test skipped (the private-fixture ones always do here).
      - run: python -m pytest -q -rs

  download-copies:
    name: Download-copy deletion guards (pytest, Windows)
    # The Downloads cleanup deletes files through Win32 handles; on Linux those tests skip. Here they must run:
    # the exclusive open, the link and reparse checks, the sharing refusal and the delete through the handle.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -q -rs --junitxml=download-copies.xml tests/test_download_copies.py
          tests/test_units.py::test_a_finished_archives_downloads_copy_is_deleted
          tests/test_units.py::test_only_a_finished_archive_with_a_download_seen_in_progress_has_its_copy_cleaned
      - name: Fail if any of those tests was skipped
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("download-copies.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} tests, {skipped} skipped")
          sys.exit(1 if skipped or not tests else 0)

  model:
    name: Model tests (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/rating3/requirements.txt
      - run: python -m pip install -r model/rating3/requirements.txt
      - run: python -m unittest discover -v -s model/rating3 -p "test_*.py"

  formal:
    name: Formal models (TLC)
    # Every TLA+ configuration at the bounds its .cfg states. A configuration that check_models.py lists in
    # FAIL must still produce its counterexample on the named property, so a model edit that makes it unable
    # to fail breaks this job too.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # the checksum is run.py's JAR_SHA256; run.py checks it again before every run
      - name: Download the pinned TLA+ tools
        run: |
          mkdir -p formal/tools
          curl -fsSL --retry 3 -o formal/tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  formal/tools/tla2tools.jar" \
            | sha256sum -c -
      - run: python -I formal/check_models.py --all

  plugin:
    name: Plugin build and tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # the test project compiles plugin/Core only; this builds the plugin itself against CounterStrikeSharp
      - run: dotnet build plugin/BotMatchStats.csproj -c Release
      - run: dotnet test plugin/BotMatchStats.Tests
