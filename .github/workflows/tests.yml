name: Tests

# Every component's own test suite, on every pull request and on main. The jobs read the checked-out
# tree only, with no secrets and read-only permissions. Tests that need the private data folder
# (pro demos, HLTV files, the packs) skip with a message when it is missing, as it is here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App typecheck, vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm exec tsc -p tsconfig.node.json --noEmit
      - run: pnpm test
      - run: pnpm build
      # the UI chunks must not carry the stats engine (tools/bundle-budget.ts)
      - run: pnpm bundle-budget

  rust:
    name: Rust tests (cargo test --lib)
    # the desktop app targets Windows: its Bot Mode code and tests use Windows APIs and paths
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rust-version in app/src-tauri/Cargo.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: cargo test --lib --locked
        working-directory: app/src-tauri

  extractor:
    name: Extractor tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  model:
    name: Model tests (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/rating3/requirements.txt
      - run: python -m pip install -r model/rating3/requirements.txt
      - run: python -m unittest discover -v -s model/rating3 -p "test_*.py"

  plugin:
    name: Plugin build and tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # the test project compiles plugin/Core only; this builds the plugin itself against CounterStrikeSharp
      - run: dotnet build plugin/BotMatchStats.csproj -c Release
      - run: dotnet test plugin/BotMatchStats.Tests
